plugins {
    // Apply the foojay-resolver plugin to allow automatic download of JDKs.
    // The version stays inline: the version catalog is not available in this block.
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'eclipse-bot-v3'

// Subprojects are added here with `include` as the bot's modules land.
// Each applies buildlogic.java-application-conventions or buildlogic.java-library-conventions
// from buildSrc, and takes dependency versions from gradle/libs.versions.toml.
