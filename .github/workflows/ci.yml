# Continuous integration (ADR 0008).
# lint: runs every pre-commit hook on the whole repository.
# build: migrates a throwaway PostgreSQL from compose.yaml, generates the jOOQ sources, then builds and tests.
# discord: installs locked npm dependencies, checks types, tests, and builds without connecting to Discord.
# Tools come from mise.lock, so CI uses the same versions as a local checkout.
name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions: {}
# CI supplies its own settings; never load developer values from root .env.
env:
  MISE_NO_ENV: "1"
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install tools
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          # Only what the hooks need. Ruby builds from source, and no hook uses it.
          install_args: python pre-commit actionlint editorconfig-checker hadolint ruff shellcheck shfmt yamlfmt zizmor
      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Exports JAVA_HOME, so Gradle runs on the pinned JDK instead of the runner's default one.
      - name: Install Java
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install_args: java
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      # Random passwords for a database that only lives for this job. They are masked in the log.
      - name: Start PostgreSQL
        run: |
          postgres_password="$(openssl rand -hex 16)"
          catalog_password="$(openssl rand -hex 16)"
          guild_password="$(openssl rand -hex 16)"
          guild_app_password="$(openssl rand -hex 16)"
          echo "::add-mask::$postgres_password"
          echo "::add-mask::$catalog_password"
          echo "::add-mask::$guild_password"
          echo "::add-mask::$guild_app_password"
          printf 'POSTGRES_USER=eclipse\nPOSTGRES_PASSWORD=%s\nPOSTGRES_DB=eclipse_bot\n' "$postgres_password" >.env
          {
            echo "CATALOG_DB_URL=jdbc:postgresql://localhost:5432/eclipse_bot"
            echo "CATALOG_DB_USER=catalog_migration"
            echo "CATALOG_DB_PASSWORD=$catalog_password"
            echo "GUILD_DB_URL=jdbc:postgresql://localhost:5432/eclipse_bot"
            echo "GUILD_DB_USER=guild_migration"
            echo "GUILD_DB_PASSWORD=$guild_password"
            echo "GUILD_APP_DB_USER=guild_application"
            echo "GUILD_APP_DB_PASSWORD=$guild_app_password"
          } >>"$GITHUB_ENV"
          docker compose up --detach --wait
      # ADR 0007: schemas and their migration roles exist before Flyway runs.
      - name: Create the catalog schema
        run: |
          docker compose exec -T -e CATALOG_DB_PASSWORD postgres \
            psql --set ON_ERROR_STOP=1 --username eclipse --dbname eclipse_bot <<'SQL'
          \getenv password CATALOG_DB_PASSWORD
          CREATE ROLE catalog_migration LOGIN PASSWORD :'password';
          CREATE SCHEMA catalog AUTHORIZATION catalog_migration;
          SQL
      - name: Bootstrap the guild schema and roles
        run: |
          docker compose exec -T \
            -e GUILD_DB_USER -e GUILD_DB_PASSWORD \
            -e GUILD_APP_DB_USER -e GUILD_APP_DB_PASSWORD postgres \
            psql --set ON_ERROR_STOP=1 --username eclipse --dbname eclipse_bot \
            <tools/postgres/bootstrap-guild.sql
      - name: Migrate and generate jOOQ sources
        run: |
          mise run --skip-tools catalog:prepare
          mise run --skip-tools guild:prepare
      - name: Check guild SQL constraints and behavior
        run: mise run --skip-tools guild:test
      # The diagrams are generated from the migrated catalog, so a migration
      # change without a regenerated page fails here.
      - name: Check the guild ER diagrams are current
        run: |
          python3 tools/postgres/generate-guild-erd.py \
            --container "$(docker compose ps --quiet postgres)" \
            --database eclipse_bot --user "$GUILD_DB_USER"
          git diff --exit-code -- docs/design/guild-er-diagram.md
      - name: Build and test
        run: mise run --skip-tools java:build
      - name: Check the convention plugins
        run: mise run --skip-tools java:conventions:check
  discord:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Node.js
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install_args: node
      # Node is already installed; avoid installing unrelated root tools for this job.
      - name: Install, check, test and build
        run: mise run --skip-tools discord:ci
