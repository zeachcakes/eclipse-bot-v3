# Fails a pull request whose title is not a Conventional Commit, such as "feat(gradle): Added convention plugins" (ADR 0008).
# A separate workflow, because title edits must not rerun or skip the CI jobs.
name: PR title
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
permissions: {}
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - name: Check the title
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
