# Pull request labels (ADR 0008).
# sync: applies .github/labels.yml to the repository labels.
# label: labels each pull request by the paths it changes, using the rules in .github/labeler.yml.
# Each job runs only for its own events, so the sync job's checkout never runs on pull_request_target.
# pull_request_target gives the label job a write token even on fork PRs, so that job must never check
# out or run PR code.
name: Labels
on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] the label job never checks out or runs PR code
  push:
    branches: [main]
    paths: [.github/labels.yml, .github/workflows/labels.yml]
  workflow_dispatch:
permissions: {}
jobs:
  sync:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Sync labels
        uses: crazy-max/ghaction-github-labeler@548a7c3603594ec17c819e1239f281a3b801ab4d # v6.0.0
        with:
          # Deleting a label strips it from every issue and PR, so labels missing from the file are kept.
          skip-delete: true
  label:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: labels-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      # Nothing is checked out, so the labeler reads .github/labeler.yml from main through the API.
      - name: Label by changed paths
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          sync-labels: true
