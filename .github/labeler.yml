# Path rules for actions/labeler, run by the label job in .github/workflows/labels.yml (ADR 0008).
# Every label here must also be defined in .github/labels.yml. A new service gets its own label.
build:
  - changed-files:
      - any-glob-to-any-file: ["**/*.gradle", "gradle.properties", "gradle/**", "gradlew", "gradlew.bat", "tools/gradle/**"]
database:
  - changed-files:
      - any-glob-to-any-file: ["services/*/schema/**", "compose.yaml", ".env.example"]
catalog:
  - changed-files:
      - any-glob-to-any-file: ["services/catalog/**"]
discord:
  - changed-files:
      - any-glob-to-any-file: ["services/discord/**"]
libraries:
  - changed-files:
      - any-glob-to-any-file: ["libraries/**"]
documentation:
  - changed-files:
      - any-glob-to-any-file: ["docs/**", "**/*.md"]
tooling:
  - changed-files:
      - any-glob-to-any-file: ["mise.toml", "mise.lock", ".pre-commit-config.yaml", ".editorconfig", ".gitattributes", ".gitignore", ".vscode/**"]
ci:
  - changed-files:
      - any-glob-to-any-file: [".github/**"]
dependencies:
  - changed-files:
      - any-glob-to-any-file: ["gradle/libs.versions.toml", "gradle/wrapper/**", "mise.lock", "**/package.json", "**/package-lock.json"]
