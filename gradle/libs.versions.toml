# Shared by the application and the independent tools/gradle included build.
# Alignment rules for these versions: docs/decisions/0006-layered-convention-plugins.md.
[versions]
spring-boot = "4.1.1"
errorprone-plugin = "4.3.0"
errorprone = "2.50.0"
nullaway = "0.14.2"
jspecify = "1.0.1"
jooq-plugin = "10.1.1"
jooq = "3.21.9"
flyway = "13.10.3"
postgresql = "42.7.14"
junit = "6.1.3"
assertj = "3.27.7"

[libraries]
errorprone-plugin = { module = "net.ltgt.gradle:gradle-errorprone-plugin", version.ref = "errorprone-plugin" }
errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone" }
nullaway = { module = "com.uber.nullaway:nullaway", version.ref = "nullaway" }
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
spring-boot-plugin = { module = "org.springframework.boot:spring-boot-gradle-plugin", version.ref = "spring-boot" }
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
spring-webflux = { module = "org.springframework.boot:spring-boot-starter-webflux" }
spring-r2dbc = { module = "org.springframework.boot:spring-boot-starter-data-r2dbc" }
spring-jooq = { module = "org.springframework.boot:spring-boot-starter-jooq" }
spring-test = { module = "org.springframework.boot:spring-boot-starter-test" }
hikari = { module = "com.zaxxer:HikariCP" }
reactor-test = { module = "io.projectreactor:reactor-test" }
r2dbc-postgresql = { module = "org.postgresql:r2dbc-postgresql" }
jooq-plugin = { module = "nu.studer:gradle-jooq-plugin", version.ref = "jooq-plugin" }
jooq-runtime = { module = "org.jooq:jooq", version.ref = "jooq" }
jooq-codegen = { module = "org.jooq:jooq-codegen", version.ref = "jooq" }
flyway-plugin = { module = "org.flywaydb:flyway-gradle-plugin", version.ref = "flyway" }
flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
flyway-postgresql = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flyway" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj = { module = "org.assertj:assertj-core", version.ref = "assertj" }

[plugins]
errorprone = { id = "net.ltgt.errorprone", version.ref = "errorprone-plugin" }
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
jooq = { id = "nu.studer.jooq", version.ref = "jooq-plugin" }
flyway = { id = "org.flywaydb.flyway", version.ref = "flyway" }
