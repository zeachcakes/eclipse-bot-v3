# This file was generated by the Gradle 'init' task.
# https://docs.gradle.org/current/userguide/version_catalogs.html#sec::toml-dependencies-format
#
# Every dependency and plugin version for the Gradle build lives here (ADR 0004).
# Build scripts reference entries as `libs.<alias>`. Convention plugins in buildSrc
# look them up with `versionCatalogs.named('libs')`, because they cannot use the accessors.

[versions]
errorprone = "2.50.0"
errorprone-plugin = "5.1.1"
flyway = "13.8.0"
gradle-jooq-plugin = "10.2.1"
guava = "33.7.1-jre"
jayflake = "0.1"
jool = "0.9.15"
jooq = "3.21.9"
jqwik = "1.10.1"
json-patch = "1.13"
json-unit = "6.2.0"
jspecify = "1.0.1"
junit-jupiter = "6.0.1"
log4j = "2.26.1"
netty = "4.2.18.Final"
nullaway = "0.14.2"
postgresql = "42.7.13"
r2dbc-postgresql = "1.1.3.RELEASE"
slf4j = "2.0.20"
spring-boot = "4.1.1"
testcontainers = "2.0.5"

[libraries]
errorprone = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone" }
flywayCore = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
flywayPlugin = { module = "org.flywaydb:flyway-gradle-plugin", version.ref = "flyway" }
flywayPostgresql = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flyway" }
gradleJooqPlugin = { module = "nu.studer:gradle-jooq-plugin", version.ref = "gradle-jooq-plugin" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }
guava-test = { module = "com.google.guava:guava-testlib", version.ref = "guava" }
jayflake = { module = "io.github.spiderpig86:jayflake", version.ref = "jayflake" }
jool = { module = "org.jooq:jool", version.ref = "jool" }
jooq-postgres-extensions = { module = "org.jooq:jooq-postgres-extensions", version.ref = "jooq" }
jqwik = { module = "net.jqwik:jqwik", version.ref = "jqwik" }
json-patch = { module = "com.github.java-json-tools:json-patch", version.ref = "json-patch" }
json-unit-assertj = { module = "net.javacrumbs.json-unit:json-unit-assertj", version.ref = "json-unit" }
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit-jupiter" }
# No version: the junit-bom platform that junit-jupiter publishes aligns it.
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
log4j-bom = { module = "org.apache.logging.log4j:log4j-bom", version.ref = "log4j" }
netty-bom = { module = "io.netty:netty-bom", version.ref = "netty" }
# Plugin marker for the same release as gradleJooqPlugin, so both share one version.
nu-studer-jooq = { module = "nu.studer.jooq:nu.studer.jooq.gradle.plugin", version.ref = "gradle-jooq-plugin" }
nullaway = { module = "com.uber.nullaway:nullaway", version.ref = "nullaway" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
r2dbc-postgresql = { module = "org.postgresql:r2dbc-postgresql", version.ref = "r2dbc-postgresql" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
spring-boot = { module = "org.springframework.boot:spring-boot-starter", version.ref = "spring-boot" }
spring-boot-dependencies = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
spring-boot-plugin = { module = "org.springframework.boot:org.springframework.boot.gradle.plugin", version.ref = "spring-boot" }
testcontainers-core = { module = "org.testcontainers:testcontainers", version.ref = "testcontainers" }
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql", version.ref = "testcontainers" }

# No version: resolve these through the spring-boot-dependencies platform, which manages all of them.
assertj-core = { module = "org.assertj:assertj-core" }
assertj-guava = { module = "org.assertj:assertj-guava" }
io-projectreactor-test = { module = "io.projectreactor:reactor-test" }
jakarta-xml-bind = { module = "jakarta.xml.bind:jakarta.xml.bind-api" }
spring-boot-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-devtools = { module = "org.springframework.boot:spring-boot-devtools" }
spring-boot-log4j2 = { module = "org.springframework.boot:spring-boot-starter-log4j2" }
spring-boot-logging = { module = "org.springframework.boot:spring-boot-starter-logging" }
spring-boot-r2dbc = { module = "org.springframework.boot:spring-boot-starter-data-r2dbc" }
spring-boot-starter-jooq = { module = "org.springframework.boot:spring-boot-starter-jooq" }
spring-boot-starter-json = { module = "org.springframework.boot:spring-boot-starter-json" }
spring-boot-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-boot-webflux = { module = "org.springframework.boot:spring-boot-starter-webflux" }
spring-hateoas = { module = "org.springframework.hateoas:spring-hateoas" }
spring-security-core = { module = "org.springframework.security:spring-security-core" }
spring-security-test = { module = "org.springframework.security:spring-security-test" }

[bundles]
java-core-libs = ["guava", "jool", "jspecify", "jayflake"]
java-core-test-libs = [
  "assertj-core",
  "assertj-guava",
  "guava-test",
  "jqwik",
]
java-compiler-tools = ["errorprone", "nullaway"]
java-dev-tools = ["spring-boot-devtools"]
jooq-db = [
  "spring-boot-starter-jooq",
  "spring-boot-r2dbc",
  "r2dbc-postgresql",
  "jooq-postgres-extensions",
]
service-server-libs = [
  "spring-boot",
  "spring-boot-actuator",
  "spring-boot-log4j2",
  "spring-boot-logging",
  "spring-boot-webflux",
  "spring-security-core",
  "spring-hateoas",
  "json-patch",
]
service-client-libs = ["spring-boot-webflux"]
service-test-libs = [
  "io-projectreactor-test",
  "json-unit-assertj",
  "spring-boot-test",
  "spring-security-test",
]
testcontainers = [
  "testcontainers-core",
  "testcontainers-postgresql",
]

[plugins]
errorprone = { id = "net.ltgt.errorprone", version.ref = "errorprone-plugin" }
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
