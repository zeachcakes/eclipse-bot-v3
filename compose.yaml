# Local development database. The datastore decision is recorded in docs/decisions/0003-postgresql-datastore.md.
# Copy .env.example to .env before the first `docker compose up`.
name: eclipse-bot
services:
  postgres:
    # Tag for readers, digest (multi-arch index) for reproducibility. Update both together.
    image: postgres:18.6-trixie@sha256:86c951e05bf56c93d95d397747fb8820ac76cc3bedb78f43abd83eedbe3666ae
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      # Loopback only, so the database is not reachable from the local network.
      - 127.0.0.1:${POSTGRES_PORT:-5432}:5432
    volumes:
      # From PostgreSQL 18 the image stores data under /var/lib/postgresql/<major>/docker,
      # so mount the parent directory, not the pre-18 /var/lib/postgresql/data.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"'
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres-data:
