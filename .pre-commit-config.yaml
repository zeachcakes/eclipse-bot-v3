# Local hooks run the tools pinned in mise.toml, so developers and CI runners use the same versions.
# Run `mise install` before `pre-commit install` locally, and before `pre-commit run --all-files` in CI.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-json
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
      - id: check-symlinks
      - id: check-toml
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
  - repo: local
    hooks:
      - id: editorconfig-checker
        name: editorconfig-checker
        entry: editorconfig-checker
        language: unsupported
        types: [text]
        # LICENSE is upstream Apache 2.0 text with 3-space indents.
        exclude: ^LICENSE$
      - id: shellcheck
        name: shellcheck
        entry: shellcheck
        language: unsupported
        types: [shell]
      - id: shfmt
        name: shfmt
        entry: shfmt --write
        language: unsupported
        types: [shell]
        # Generated by `gradle wrapper`; reformatting it would diverge from upstream.
        exclude: ^gradlew$
      - id: ruff-check
        name: ruff check
        entry: ruff check --fix --force-exclude
        language: unsupported
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: ruff format --force-exclude
        language: unsupported
        types_or: [python, pyi]
      - id: yamlfmt
        name: yamlfmt
        entry: yamlfmt
        language: unsupported
        types: [yaml]
      - id: hadolint
        name: hadolint
        entry: hadolint
        language: unsupported
        types: [dockerfile]
      - id: actionlint
        name: actionlint
        entry: actionlint
        language: unsupported
        files: ^\.github/workflows/.*\.ya?ml$
