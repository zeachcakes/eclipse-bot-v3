/*
 * This file was generated by the Gradle 'init' task.
 */

plugins {
    // Apply the java Plugin to add support for Java.
    id 'java'
}

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
}

// Precompiled script plugins cannot use the generated `libs` accessors, so look entries up
// in the version catalog of the project that applies this plugin (gradle/libs.versions.toml).
def libs = versionCatalogs.named('libs')

dependencies {
    // Use JUnit Jupiter for testing.
    testImplementation libs.findLibrary('junit-jupiter').get()

    testRuntimeOnly libs.findLibrary('junit-platform-launcher').get()
}

// Apply a specific Java toolchain to ease working on different environments.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.named('test') {
    // Use JUnit Platform for unit tests.
    useJUnitPlatform()
}
