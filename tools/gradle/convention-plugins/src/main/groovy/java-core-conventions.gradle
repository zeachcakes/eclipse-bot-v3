import javax.lang.model.SourceVersion

plugins {
    id 'java-library'
    id 'net.ltgt.errorprone'
}

def catalog = extensions.getByType(VersionCatalogsExtension).named('libs')
def basePackage = providers.gradleProperty('baseJavaPackage').getOrElse('')
if (!SourceVersion.isName(basePackage)) {
    throw new GradleException('baseJavaPackage must be a valid Java package name')
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

configurations.configureEach {
    exclude group: 'junit', module: 'junit'
}

dependencies {
    errorprone catalog.findLibrary('errorprone-core').get()
    errorprone catalog.findLibrary('nullaway').get()
    compileOnlyApi catalog.findLibrary('jspecify').get()

    testImplementation platform(catalog.findLibrary('junit-bom').get())
    testImplementation catalog.findLibrary('junit-jupiter').get()
    testImplementation catalog.findLibrary('assertj').get()
    testRuntimeOnly catalog.findLibrary('junit-launcher').get()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-Xlint:all', '-Xlint:-processing', '-Werror', '-parameters'])
    options.errorprone {
        disableWarningsInGeneratedCode.set(true)
        error('NullAway')
        option('NullAway:AnnotatedPackages', basePackage)
    }
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}
